name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller Pynzor.spec

      - name: Smoke test binary
        run: |
          dist\Pynzor.exe --version
          dist\Pynzor.exe --help
          dist\Pynzor.exe headers --help
          dist\Pynzor.exe tui --help
          dist\Pynzor.exe report docs\samples\sample_report.json
        shell: cmd

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pynzor.exe
          generate_release_notes: true

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller Pynzor.spec

      - name: Smoke test binary
        run: |
          ./dist/Pynzor --version
          ./dist/Pynzor --help
          ./dist/Pynzor headers --help
          ./dist/Pynzor tui --help
          # Renders Rich's box-drawing output, which the --help screens alone
          # do not fully cover, and needs no network.
          ./dist/Pynzor report docs/samples/sample_report.json > /dev/null
          # Bare invocation with no TTY must fall back to help, not try to
          # start the full-screen dashboard. Three things this has to survive:
          # the run exits non-zero by design (Click's "Missing command"), Rich
          # styles its output on CI so escape sequences land between "Usage:"
          # and the program name, and `grep -q` exits on its first match and
          # would leave the producer writing into a closed pipe. So capture it,
          # strip the escapes, then assert on the text.
          ./dist/Pynzor < /dev/null > bare-run.txt 2>&1 || true
          sed "s/$(printf '\033')\[[0-9;]*[a-zA-Z]//g" bare-run.txt > bare-run-plain.txt
          grep -q 'Usage: Pynzor' bare-run-plain.txt || { cat bare-run.txt; exit 1; }

      - name: Rename binary
        run: mv dist/Pynzor dist/Pynzor-macos

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pynzor-macos
          generate_release_notes: false

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller Pynzor.spec

      - name: Smoke test binary
        run: |
          ./dist/Pynzor --version
          ./dist/Pynzor --help
          ./dist/Pynzor headers --help
          ./dist/Pynzor tui --help
          # Renders Rich's box-drawing output, which the --help screens alone
          # do not fully cover, and needs no network.
          ./dist/Pynzor report docs/samples/sample_report.json > /dev/null
          # Bare invocation with no TTY must fall back to help, not try to
          # start the full-screen dashboard. Three things this has to survive:
          # the run exits non-zero by design (Click's "Missing command"), Rich
          # styles its output on CI so escape sequences land between "Usage:"
          # and the program name, and `grep -q` exits on its first match and
          # would leave the producer writing into a closed pipe. So capture it,
          # strip the escapes, then assert on the text.
          ./dist/Pynzor < /dev/null > bare-run.txt 2>&1 || true
          sed "s/$(printf '\033')\[[0-9;]*[a-zA-Z]//g" bare-run.txt > bare-run-plain.txt
          grep -q 'Usage: Pynzor' bare-run-plain.txt || { cat bare-run.txt; exit 1; }

      - name: Rename binary
        run: mv dist/Pynzor dist/Pynzor-linux

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pynzor-linux
          generate_release_notes: false

  publish-pypi:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
