name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: Pyright type check
        run: python -m pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest --cov --cov-report=term-missing

  smoke:
    name: Installed-wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Install wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install dist/*.whl

      - name: Smoke test console scripts and bundled data (outside repo root)
        working-directory: ${{ runner.temp }}
        run: |
          BIN="$RUNNER_TEMP/smoke-venv/bin"
          "$BIN/Pynzor" --version
          "$BIN/Pynzor" --help
          "$BIN/Pynzor" headers --help
          "$BIN/Pynzor" tui --help
          # Bare invocation with no TTY must fall back to help, not try to
          # start the full-screen dashboard. Three things this has to survive:
          # the run exits non-zero by design (Click's "Missing command"), Rich
          # styles its output on CI so escape sequences land between "Usage:"
          # and the program name, and `grep -q` exits on its first match and
          # would leave the producer writing into a closed pipe. So capture it,
          # strip the escapes, then assert on the text.
          "$BIN/Pynzor" < /dev/null > bare-run.txt 2>&1 || true
          sed "s/$(printf '\033')\[[0-9;]*[a-zA-Z]//g" bare-run.txt > bare-run-plain.txt
          grep -q 'Usage: Pynzor' bare-run-plain.txt || { cat bare-run.txt; exit 1; }
          "$BIN/pynzor" --version
          # A Windows console hands the process a legacy code page, and the
          # Windows binary is only built at release time -- so a banner that
          # cannot be encoded took down every command but --version, and the
          # first anyone knew of it was a failed release tag. Exercise the same
          # encoding here, where it costs a second. `report` is included
          # because it renders Rich's box-drawing output, not just the banner.
          PYTHONIOENCODING=cp1252 "$BIN/Pynzor" --help > /dev/null
          PYTHONIOENCODING=cp1252 "$BIN/Pynzor" --version > /dev/null
          PYTHONIOENCODING=cp1252 "$BIN/Pynzor" report \
            "$GITHUB_WORKSPACE/docs/samples/sample_report.json" > /dev/null
          "$BIN/python" -c "import importlib.resources as r; assert (r.files('pynzor')/'py.typed').is_file(); assert (r.files('pynzor.cli')/'config.yaml').is_file(); assert (r.files('pynzor.cli')/'wordlists'/'common-dirs.txt').is_file(); assert (r.files('pynzor.output')/'templates'/'report.html.j2').is_file(); assert (r.files('pynzor.tui')/'styles.tcss').is_file(); print('bundled package data OK')"
