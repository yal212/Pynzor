[project]
name = "Pynzor"
version = "1.1.0"
description = "CTF and lab web recon CLI for ports, fuzzing, headers, SQLi, XSS, and subdomains"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "yal212", email = "yal212yal@gmail.com"}
]
keywords = ["security", "ctf", "lab", "pentesting", "web", "reconnaissance", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "dnspython>=2.6",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5",
]

[project.urls]
Homepage = "https://github.com/yal212/Pynzor"
Repository = "https://github.com/yal212/Pynzor"
Issues = "https://github.com/yal212/Pynzor/issues"

[project.scripts]
Pynzor = "cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["reports", "tests", "tests.*", "local", "local.*", "docs", "docs.*"]

[tool.setuptools.package-data]
"cli" = ["config.yaml", "wordlists/*"]
"output" = ["templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["cli", "modules", "output", "utils"]
omit = ["tests/*", "*/conftest.py"]

[tool.pyright]
venv = ".venv"
