[project]
name = "Pynzor"
version = "1.1.0"
description = "CTF and lab web recon CLI for ports, fuzzing, headers, SQLi, XSS, and subdomains"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "yal212", email = "yal212yal@gmail.com"}
]
keywords = ["security", "ctf", "lab", "pentesting", "web", "reconnaissance", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "textual>=0.79",
    "dnspython>=2.6",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.urls]
Homepage = "https://github.com/yal212/Pynzor"
Repository = "https://github.com/yal212/Pynzor"
Issues = "https://github.com/yal212/Pynzor/issues"

[project.scripts]
Pynzor = "pynzor.cli.main:main"
pynzor = "pynzor.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pynzor" = ["py.typed"]
"pynzor.cli" = ["config.yaml", "wordlists/*"]
"pynzor.tui" = ["*.tcss"]
"pynzor.output" = ["templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pynzor"]
omit = ["tests/*", "*/conftest.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly. `ruff>=0.6` is unpinned, and ruff's *default*
# selection has grown over releases -- 0.16 flags rules (DTZ, BLE, UP045, I001)
# this codebase was never written against, so leaving it implicit means a new
# ruff release silently breaks CI. This is ruff's long-standing default set,
# which is what the code was written against (line length is enforced by
# `ruff format`, not E501).
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
venv = ".venv"
